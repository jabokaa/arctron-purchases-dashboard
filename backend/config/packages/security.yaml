security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Usuários da tabela "users", identificados pelo e-mail
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        # API: sem sessão/cookie. Cada requisição se identifica com "Authorization: Bearer <token>",
        # token emitido pelo POST /api/auth/login e validado pelo ApiTokenHandler.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            access_token:
                token_handler: App\Security\ApiTokenHandler
                failure_handler: App\Security\ApiAuthenticationErrorHandler
            entry_point: App\Security\ApiAuthenticationErrorHandler

        main:
            lazy: true
            provider: app_user_provider

    # Só a primeira regra que bate com a URL é aplicada. Todas as rotas /api exigem o token do login
    # (Authorization: Bearer ...), exceto:
    # - o próprio login;
    # - o webhook do WooCommerce, que não tem como enviar o token: ele se autentica pela assinatura
    #   HMAC do corpo (X-WC-Webhook-Signature), conferida no controller (401 se for inválida).
    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
